<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content OS — Control Center</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">CO</div>
        <div>
          <div class="brand-name">Content OS</div>
          <div class="brand-sub">Control center</div>
        </div>
      </div>
      <div class="nav-group">Overview</div>
      <div class="nav-item active" data-view="dashboard"><span class="ico">▣</span> Dashboard</div>
      <div class="nav-group">Workflow</div>
      <div class="nav-item" data-view="content"><span class="ico">◆</span> Content</div>
      <div class="nav-item" data-view="production"><span class="ico">▶</span> Production</div>
      <div class="nav-item" data-view="approvals"><span class="ico">✓</span> Approvals</div>
      <div class="nav-item" data-view="distribution"><span class="ico">↑</span> Distribution</div>
      <div class="nav-item" data-view="calendar"><span class="ico"> </span> Calendar</div>
      <div class="nav-group">System</div>
      <div class="nav-item" data-view="assets"><span class="ico"> </span> Assets</div>
      <div class="nav-item" data-view="templates"><span class="ico"> </span> Templates</div>
      <div class="nav-item" data-view="settings"><span class="ico">⚙</span> Settings</div>
      <div class="nav-item" data-view="system"><span class="ico"> </span> System</div>
      <div style="margin-top:auto; padding:10px;">
        <div class="row" style="justify-content:space-between;">
          <span style="font-size:12px;color:var(--text-muted);">Theme</span>
          <select class="select" id="themeSelect" style="width:auto;padding:4px 8px;font-size:12px;">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div>
          <div class="topbar-title" id="viewTitle">Dashboard</div>
        </div>
        <div class="topbar-actions">
          <button class="btn sm" id="refreshBtn">Refresh</button>
          <button class="btn sm ghost" id="menuBtn" style="display:none;">☰</button>
        </div>
      </header>
      <div class="content" id="content">Loading…</div>
    </div>
  </div>
  <div id="toast"></div>
  <div id="modalBackdrop" class="modal-backdrop" style="display:none;">
    <div class="modal" role="dialog" aria-modal="true">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="row" style="justify-content:flex-end;margin-top:16px;">
        <button class="btn" id="modalCancel">Cancel</button>
        <button class="btn primary" id="modalConfirm">Confirm</button>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
